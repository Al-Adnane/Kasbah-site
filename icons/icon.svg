<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#FEFCFA"/>
  <!-- Kasbah fortress icon in brand red -->
  <g transform="translate(96, 56) scale(1.25)" fill="#C1440E">
    <!-- Left tower -->
    <rect x="40" y="40" width="40" height="260" rx="4"/>
    <rect x="30" y="20" width="60" height="30" rx="4"/>
    <rect x="30" y="10" width="12" height="20"/>
    <rect x="54" y="10" width="12" height="20"/>
    <rect x="78" y="10" width="12" height="20"/>
    <!-- Right tower -->
    <rect x="180" y="40" width="40" height="260" rx="4"/>
    <rect x="170" y="20" width="60" height="30" rx="4"/>
    <rect x="170" y="10" width="12" height="20"/>
    <rect x="194" y="10" width="12" height="20"/>
    <rect x="218" y="10" width="12" height="20"/>
    <!-- Center tower (taller) -->
    <rect x="105" y="60" width="50" height="240" rx="4"/>
    <rect x="95" y="35" width="70" height="35" rx="4"/>
    <rect x="95" y="20" width="14" height="25"/>
    <rect x="123" y="20" width="14" height="25"/>
    <rect x="151" y="20" width="14" height="25"/>
    <!-- Connecting walls -->
    <rect x="80" y="100" width="25" height="200" rx="2"/>
    <rect x="155" y="100" width="25" height="200" rx="2"/>
    <!-- Gate arch -->
    <rect x="115" y="220" width="30" height="80" rx="15"/>
    <!-- Circuit/tech lines (representing digital protection) -->
    <circle cx="130" cy="160" r="8"/>
    <rect x="127" y="130" width="6" height="25"/>
    <rect x="127" y="172" width="6" height="20"/>
    <rect x="100" y="157" width="25" height="6"/>
    <rect x="135" y="157" width="25" height="6"/>
    <circle cx="95" cy="160" r="5"/>
    <circle cx="165" cy="160" r="5"/>
  </g>
</svg>
