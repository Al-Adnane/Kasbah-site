  "api/src/moats/OBFUSCATION_DECODER_README.md",
  "IMPLEMENTATION_CHECKLIST.md",
  "docs/MOAT_V3_PRIVILEGE_INFERENCE.md",
  "docs/TEST_GUIDE.md",
  # Red-team test toolkit — all payloads are intentional attack-simulation fixtures
  "api/src/moats/redteam-toolkit-complete.js",
  # Demo/template app with placeholder API keys in source and README
  "kasbah-guard-dist/apps/api-guard/",
  "kasbah-guard-dist/apps/slack-guard/README.md",
  # ML training data — positive/negative sample strings used to train stumps
  "scripts/train_stumps.py",
  "kasbah-guard-dist/scripts/train_stumps.py",
  # Build artifacts (Next.js compiled output) — not source code
  "web-app/.next/",
  # Demo/webapp page — contains intentional example API payloads for UI demo
  "public/webapp.html",
  # Public detector.js — synced copy of extension detector with selfTest patterns
  "public/detector.js",
]

