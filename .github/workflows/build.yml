name: Build Kasbah Guard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: kasbah-guard-dist/apps/desktop
        run: npm install

      - name: Build Tauri app (macOS)
        working-directory: kasbah-guard-dist/apps/desktop
        run: npx tauri build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasbah-guard-macos
          path: |
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: kasbah-guard-dist/apps/desktop
        run: npm install

      - name: Build Tauri app (Windows)
        working-directory: kasbah-guard-dist/apps/desktop
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasbah-guard-windows
          path: |
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: kasbah-guard-dist/apps/desktop
        run: npm install

      - name: Build Tauri app (Linux)
        working-directory: kasbah-guard-dist/apps/desktop
        run: npx tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasbah-guard-linux
          path: |
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            kasbah-guard-dist/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kasbah-guard-macos/**/*
            kasbah-guard-windows/**/*
            kasbah-guard-linux/**/*
          draft: true
          generate_release_notes: true
