name = "kasbah-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Custom domain — bekasbah.com is on Cloudflare DNS
routes = [{ pattern = "api.bekasbah.com/*", zone_name = "bekasbah.com" }]

[vars]
CORS_ORIGIN = "https://bekasbah.com"
JWT_ISSUER = "kasbah-guard"
PLAN_DEFAULT = "pioneer"

[[kv_namespaces]]
binding = "USERS"
id = "f4c1faaf59de42daafe691ac5875bc8b"

[[kv_namespaces]]
binding = "SESSIONS"
id = "fe0ebf04d465464b94db671bf1831667"

[[kv_namespaces]]
binding = "KASBAH_KV"
id = "de7f21de0ff34eab8eac929c203971f8"
# Used by: /api/false-positives (FP reports, 30-day TTL), /api/sentry (errors, 7-day TTL)
