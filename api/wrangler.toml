name = "kasbah-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

[vars]
CORS_ORIGIN = "https://bekasbah.com"
JWT_ISSUER = "kasbah-guard"
PLAN_DEFAULT = "pioneer"

[[kv_namespaces]]
binding = "USERS"
id = "placeholder_users_kv_id"

[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder_sessions_kv_id"
