# ──────────────────────────────────────────────────────────────────
# Kasbah Guard — Helm values
# Override any value with: helm upgrade --set key=value ...
# ──────────────────────────────────────────────────────────────────

global:
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  environment: production
  # Set to your container registry, e.g. "gcr.io/my-project"
  imageRegistry: "kasbah"
  # Namespace all resources are deployed into
  namespace: kasbah-guard

# ── Constitutional AI ──────────────────────────────────────────────
constitutionalAi:
  enabled: true
  replicaCount: 2
  image:
    repository: constitutional-ai
    tag: ""  # defaults to global.imageTag
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  probes:
    liveness:
      path: /api/validate-intent
      initialDelaySeconds: 20
      periodSeconds: 15
    readiness:
      path: /api/validate-intent
      initialDelaySeconds: 10
      periodSeconds: 10

# ── ONNX Inference ─────────────────────────────────────────────────
onnxInference:
  enabled: true
  replicaCount: 2
  image:
    repository: onnx-inference
    tag: ""
  port: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  modelStorage:
    enabled: true
    size: 10Gi
    storageClassName: standard
    mountPath: /models

# ── ZK Engine ──────────────────────────────────────────────────────
zkEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: zk-engine
    tag: ""
  port: 8081
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# ── eBPF Ticket Server ─────────────────────────────────────────────
ebpfTicketServer:
  enabled: true
  # Single replica — signing key lives in process memory.
  replicaCount: 1
  image:
    repository: ebpf-ticket-server
    tag: ""
  port: 8082
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

# ── Enterprise Dashboard ───────────────────────────────────────────
enterpriseDashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: enterprise-dashboard
    tag: ""
  port: 3001
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ── Redis ──────────────────────────────────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  port: 6379
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
  exporter:
    enabled: true
    image:
      repository: oliver006/redis_exporter
      tag: latest

# ── Ingress ────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  # cert-manager ClusterIssuer name
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: kasbah-guard-tls
  hosts:
    constitutionalAi: constitutional-ai.kasbah.internal
    onnxInference: inference.kasbah.internal
    zkEngine: zk.kasbah.internal
    enterpriseDashboard: enterprise.kasbah.internal
    ticketServer: tickets.kasbah.internal
  rateLimit:
    rps: 100
    connections: 50

# ── Network Policies ───────────────────────────────────────────────
networkPolicy:
  enabled: true
  defaultDeny: true

# ── Monitoring ─────────────────────────────────────────────────────
monitoring:
  enabled: true

  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: latest
    port: 9090
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    retention: 30d
    persistence:
      enabled: true
      size: 50Gi
      storageClassName: standard
    scrapeInterval: 15s

  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: latest
    port: 3000
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: standard
    # Admin password comes from the kasbah-guard-secrets Secret.
    adminPasswordSecretKey: GF_SECURITY_ADMIN_PASSWORD

  alerts:
    enabled: true
    rules:
      highInferenceLatencyThresholdSeconds: 0.5
      highInferenceLatencyDuration: 5m
      highRiskDetectionRateThreshold: 0.10
      highRiskDetectionRateDuration: 10m
      serviceDownDuration: 2m
      highErrorRateThreshold: 0.05
      highErrorRateDuration: 5m
      lowCacheHitRateThreshold: 0.50
      lowCacheHitRateDuration: 15m

# ── Secrets (placeholders — override via --set or external secrets) ─
secrets:
  # Do NOT commit real values. Use:
  #   helm upgrade --set secrets.jwtSecret=$(cat /path/to/secret) ...
  # or an external secrets operator (e.g. External Secrets Operator).
  jwtSecret: ""
  signingKeyHex: ""
  redisPassword: ""
  grafanaAdminPassword: ""
