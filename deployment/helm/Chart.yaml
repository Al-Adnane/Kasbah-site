apiVersion: v2
name: kasbah-guard
description: >
  Kasbah Guard — complete Kubernetes deployment chart.
  Includes constitutional AI, ONNX inference, ZK engine,
  ticket server, enterprise dashboard, Redis, Prometheus,
  and Grafana. Cloudflare Worker (api-worker) is deployed
  separately via wrangler and is not managed by this chart.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - kasbah
  - security
  - ai
  - inference
  - zero-knowledge
home: https://bekasbah.com
sources:
  - https://github.com/kasbah/kasbah-guard
maintainers:
  - name: Kasbah Platform Team
    email: platform@bekasbah.com
annotations:
  artifacthub.io/changes: |
    - Initial release: all services deployed with HPA, NetworkPolicy,
      Prometheus scraping, Grafana dashboards, and cert-manager TLS.
