# ──────────────────────────────────────────────
# Prometheus — metrics collection & storage
# Scrapes all kasbah-guard services every 15s.
# 30-day retention, 50Gi PVC.
# ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kasbah-guard
  labels:
    app: prometheus
    app.kubernetes.io/managed-by: kasbah
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: kasbah-production
        namespace: kasbah-guard

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
              # Add alertmanager targets here, e.g.:
              # - targets: ["alertmanager:9093"]

    scrape_configs:
      # ── Prometheus self-scrape ─────────────────
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # ── constitutional-ai ──────────────────────
      - job_name: constitutional-ai
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: constitutional-ai
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: constitutional-ai
            target_label: service

      # ── onnx-inference ─────────────────────────
      - job_name: onnx-inference
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: onnx-inference
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: onnx-inference
            target_label: service

      # ── zk-engine ──────────────────────────────
      - job_name: zk-engine
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: zk-engine
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: zk-engine
            target_label: service

      # ── ebpf-ticket-server ─────────────────────
      - job_name: ebpf-ticket-server
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ebpf-ticket-server
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: ebpf-ticket-server
            target_label: service

      # ── enterprise-dashboard ───────────────────
      - job_name: enterprise-dashboard
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: enterprise-dashboard
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: enterprise-dashboard
            target_label: service

      # ── redis (via exporter sidecar) ──────────
      - job_name: redis
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kasbah-guard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: redis
            action: keep
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9121
            target_label: __address__
          - action: replace
            replacement: redis
            target_label: service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: kasbah-guard
  labels:
    app: prometheus
    app.kubernetes.io/managed-by: kasbah
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kasbah-guard
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kasbah
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=45GB
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kasbah-guard
  labels:
    app: prometheus
    app.kubernetes.io/managed-by: kasbah
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kasbah-prometheus
  labels:
    app: prometheus
    app.kubernetes.io/managed-by: kasbah
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kasbah-prometheus
  labels:
    app: prometheus
    app.kubernetes.io/managed-by: kasbah
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kasbah-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kasbah-guard
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kasbah-guard
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kasbah
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
