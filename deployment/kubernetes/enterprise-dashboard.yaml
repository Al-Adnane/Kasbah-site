# ──────────────────────────────────────────────
# enterprise-dashboard  — Next.js app, port 3001
# Internal dashboard for enterprise customers.
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-dashboard
  namespace: kasbah-guard
  labels:
    app: enterprise-dashboard
    app.kubernetes.io/name: enterprise-dashboard
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/managed-by: kasbah
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: enterprise-dashboard
        app.kubernetes.io/name: enterprise-dashboard
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: enterprise-dashboard
          image: kasbah/enterprise-dashboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kasbah-guard-config
            - secretRef:
                name: kasbah-guard-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-dashboard
  namespace: kasbah-guard
  labels:
    app: enterprise-dashboard
    app.kubernetes.io/name: enterprise-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/managed-by: kasbah
spec:
  selector:
    app: enterprise-dashboard
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-dashboard-hpa
  namespace: kasbah-guard
  labels:
    app: enterprise-dashboard
    app.kubernetes.io/managed-by: kasbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-dashboard
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
