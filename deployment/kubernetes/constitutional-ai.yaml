# ──────────────────────────────────────────────
# constitutional-ai  — Next.js app, port 3000
# Validates intent before any inference is run.
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: constitutional-ai
  namespace: kasbah-guard
  labels:
    app: constitutional-ai
    app.kubernetes.io/name: constitutional-ai
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kasbah
spec:
  replicas: 2
  selector:
    matchLabels:
      app: constitutional-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: constitutional-ai
        app.kubernetes.io/name: constitutional-ai
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: constitutional-ai
          image: kasbah/constitutional-ai:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kasbah-guard-config
            - secretRef:
                name: kasbah-guard-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/validate-intent
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/validate-intent
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: constitutional-ai
  namespace: kasbah-guard
  labels:
    app: constitutional-ai
    app.kubernetes.io/name: constitutional-ai
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kasbah
spec:
  selector:
    app: constitutional-ai
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: constitutional-ai-hpa
  namespace: kasbah-guard
  labels:
    app: constitutional-ai
    app.kubernetes.io/managed-by: kasbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: constitutional-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
