# ──────────────────────────────────────────────
# Nginx Ingress — internal routing for all services
# cert-manager issues TLS certificates automatically.
# ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kasbah-guard-ingress
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/name: kasbah-guard-ingress
    app.kubernetes.io/managed-by: kasbah
  annotations:
    # Nginx ingress controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # TLS — cert-manager ClusterIssuer (adjust issuer name to match your cluster)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Body size limit (inference payloads can be large)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - constitutional-ai.kasbah.internal
        - inference.kasbah.internal
        - zk.kasbah.internal
        - enterprise.kasbah.internal
        - tickets.kasbah.internal
      secretName: kasbah-guard-tls
  rules:
    # ── Constitutional AI ───────────────────────
    - host: constitutional-ai.kasbah.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: constitutional-ai
                port:
                  number: 3000
    # ── ONNX Inference ──────────────────────────
    - host: inference.kasbah.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onnx-inference
                port:
                  number: 8080
    # ── ZK Engine ───────────────────────────────
    - host: zk.kasbah.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zk-engine
                port:
                  number: 8081
    # ── Enterprise Dashboard ─────────────────────
    - host: enterprise.kasbah.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-dashboard
                port:
                  number: 3001
    # ── Ticket Server ────────────────────────────
    - host: tickets.kasbah.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ebpf-ticket-server
                port:
                  number: 8082
