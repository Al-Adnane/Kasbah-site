# ──────────────────────────────────────────────
# NetworkPolicy — zero-trust egress/ingress model
#
# Default: deny ALL ingress AND egress in namespace.
# Explicit allow rules then open only required paths:
#   constitutional-ai -> redis
#   onnx-inference    -> constitutional-ai
#   enterprise-dashboard -> all services
#   ingress-nginx     -> all services (port 80/443)
#   prometheus        -> all pods on /metrics
# ──────────────────────────────────────────────

# ── 1. Default deny all ingress within namespace ─
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# ── 2. Default deny all egress within namespace ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# ── 3. Allow DNS resolution for all pods ─────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── 4. constitutional-ai -> redis ─────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-constitutional-ai-to-redis
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchLabels:
      app: constitutional-ai
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
---
# Redis ingress from constitutional-ai
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress-from-constitutional-ai
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: constitutional-ai
      ports:
        - port: 6379
          protocol: TCP
---
# ── 5. onnx-inference -> constitutional-ai ────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-onnx-to-constitutional-ai
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchLabels:
      app: onnx-inference
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: constitutional-ai
      ports:
        - port: 3000
          protocol: TCP
---
# constitutional-ai ingress from onnx-inference
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-constitutional-ai-ingress-from-onnx
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchLabels:
      app: constitutional-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: onnx-inference
      ports:
        - port: 3000
          protocol: TCP
---
# ── 6. enterprise-dashboard -> all services ───────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-enterprise-dashboard-egress
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchLabels:
      app: enterprise-dashboard
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: constitutional-ai
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: onnx-inference
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: zk-engine
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: ebpf-ticket-server
      ports:
        - port: 8082
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
---
# Each service allows ingress from enterprise-dashboard
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-enterprise-dashboard
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  # Applies to all non-enterprise-dashboard pods
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - constitutional-ai
          - onnx-inference
          - zk-engine
          - ebpf-ticket-server
          - redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: enterprise-dashboard
---
# ── 7. ingress-nginx -> all services ─────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - constitutional-ai
          - onnx-inference
          - zk-engine
          - enterprise-dashboard
          - ebpf-ticket-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
---
# ── 8. prometheus scrape all pods on /metrics ────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: kasbah-guard
  labels:
    app.kubernetes.io/managed-by: kasbah
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kasbah-guard
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 9121
          protocol: TCP
