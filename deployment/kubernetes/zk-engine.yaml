# ──────────────────────────────────────────────
# zk-engine  — Rust HTTP server, port 8081
# Zero-knowledge proof engine for privacy-preserving
# credential verification.
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zk-engine
  namespace: kasbah-guard
  labels:
    app: zk-engine
    app.kubernetes.io/name: zk-engine
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: crypto
    app.kubernetes.io/managed-by: kasbah
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zk-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: zk-engine
        app.kubernetes.io/name: zk-engine
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: zk-engine
          image: kasbah/zk-engine:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kasbah-guard-config
            - secretRef:
                name: kasbah-guard-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: zk-engine
  namespace: kasbah-guard
  labels:
    app: zk-engine
    app.kubernetes.io/name: zk-engine
    app.kubernetes.io/component: crypto
    app.kubernetes.io/managed-by: kasbah
spec:
  selector:
    app: zk-engine
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zk-engine-hpa
  namespace: kasbah-guard
  labels:
    app: zk-engine
    app.kubernetes.io/managed-by: kasbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zk-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
