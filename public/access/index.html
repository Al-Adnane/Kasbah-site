<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasbah — Access</title>
  <link rel="icon" href="/logo-200.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --kasbah-red:#C1440E;--kasbah-red-light:rgba(193,68,14,.12);
      --bg:#FEFCFA;--card:#FFFFFF;--ink:#0F172A;--muted:#64748B;--border:#E2DDD7;
      --radius:12px;
    }
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:40px 24px}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:36px;font-weight:900;margin-bottom:8px;color:var(--kasbah-red)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:24px}
    p{color:var(--muted);font-size:16px;margin-bottom:12px}
    .back{display:inline-block;margin-top:20px;color:var(--kasbah-red);font-weight:600;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Access</h1>
    <div class="card">
      <p>Kasbah is currently in private preview. Access is invite‑only.</p>
      <p>If you've been invited, you'll receive an email with download links and instructions.</p>
      <p>Otherwise, <a href="/#waitlist" style="color:var(--kasbah-red);">join the waitlist</a> to be considered.</p>
    </div>
    <a class="back" href="/">← Back to home</a>
  </div>
</body>
</html>
