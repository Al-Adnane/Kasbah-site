<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasbah Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto py-20 px-4">
        <h1 class="text-4xl font-bold text-center mb-4">Free to Observe. Pay to Decide.</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-12">
            <div class="bg-white p-8 rounded-lg shadow">
                <h3 class="text-xl font-bold">Free</h3>
                <p class="text-3xl font-bold mt-4">$0</p>
                <ul class="mt-4 space-y-2">
                    <li>50 enforced actions/week</li>
                    <li>Local receipts</li>
                    <li>30-day history</li>
                </ul>
            </div>
            <div class="bg-white p-8 rounded-lg shadow border-2 border-blue-500">
                <h3 class="text-xl font-bold">Plus</h3>
                <p class="text-3xl font-bold mt-4">$15/mo</p>
                <ul class="mt-4 space-y-2">
                    <li>50,000 units/month</li>
                    <li>Signed receipts</li>
                    <li>90-day history</li>
                </ul>
            </div>
            <div class="bg-white p-8 rounded-lg shadow">
                <h3 class="text-xl font-bold">Fortress</h3>
                <p class="text-3xl font-bold mt-4">$150/mo</p>
                <ul class="mt-4 space-y-2">
                    <li>1,000,000 units/month</li>
                    <li>Desktop app</li>
                    <li>Priority support</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
