  <meta charset="UTF-8">

<meta name="description" content="Kasbah puts human authority in front of AI actions. Guard-grade protection. Moroccan craftsmanship. Global trust. Born in Morocco, trusted globally.">
  <meta property="og:title" content="Kasbah — Kasbah Guard">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      /* Brand Colors from KASBAH_COMPLETE_BRAND */
      --kasbah-red:#C1440E;--kasbah-red-light:rgba(193,68,14,.12);--kasbah-red-glow:rgba(193,68,14,.2);
      --fortress-stone:#D4C5B9;--fortress-stone-light:#EDE8E3;
      --desert-sky:#1E3A8A;--desert-sky-light:rgba(30,58,138,.08);
      --atlas-green:#065F46;--atlas-green-bg:rgba(6,95,70,.08);--atlas-green-border:rgba(6,95,70,.2);
      --saffron-gold:#F59E0B;--saffron-bg:rgba(245,158,11,.08);
      --midnight:#0F172A;
      /* Layout */
      --bg:#FEFCFA;--bg2:#F8F5F1;--card:#FFFFFF;--card-hover:#FEFCFA;
      --ink:#0F172A;--muted:#64748B;--subtle:#94A3B8;
      --border:#E2DDD7;--border-light:#EDE8E3;
      --terminal:#0F172A;
      --radius:12px;--radius-lg:16px
    }
    html{scroll-behavior:smooth}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--kasbah-red);color:#fff}

    /* NAV */
    nav{border-bottom:1px solid var(--border);padding:14px 0;background:rgba(254,252,250,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
    .nav-in{max-width:1080px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
    .n-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
    .n-brand img{width:32px;height:32px;border-radius:8px}
    .n-brand span{font-weight:900;font-size:15px;letter-spacing:-.02em}
    .n-links{display:flex;gap:20px;align-items:center}
    .n-links a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;transition:color .15s}
    .n-links a:hover{color:var(--ink)}
    .n-links a.n-cta{background:var(--kasbah-red);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:800;text-decoration:none;transition:all .2s}
    .n-links a.n-cta:hover{color:#fff;opacity:.9;box-shadow:0 4px 16px var(--kasbah-red-glow)}

    .page{max-width:1080px;margin:0 auto;padding:0 28px}

    /* HERO */
    .hero{padding:100px 0 80px;text-align:center;position:relative}
    .hero::before{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,var(--kasbah-red-light) 0%,transparent 70%);pointer-events:none;z-index:0}
    .hero>*{position:relative;z-index:1}
    .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--kasbah-red-light);border:1px solid var(--kasbah-red-glow);font-size:12px;font-weight:700;color:var(--kasbah-red);margin-bottom:28px;letter-spacing:.02em}
    .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--kasbah-red);animation:pulse 2s ease infinite}
    .hero h1{font-size:clamp(36px,7vw,64px);font-weight:900;letter-spacing:-.05em;line-height:1.0;margin-bottom:12px;color:var(--midnight)}
    .hero h1 em{font-style:normal;color:var(--kasbah-red)}
    .hero .tagline{font-size:20px;font-weight:800;color:var(--desert-sky);margin-bottom:8px;letter-spacing:-.02em}
    .hero .tagline-ar{font-size:16px;color:var(--muted);font-weight:500;margin-bottom:24px;direction:rtl}
    .hero .sub{font-size:17px;color:var(--muted);max-width:560px;margin:0 auto 36px;line-height:1.7;font-weight:400}
    .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .btn-hero{display:inline-flex;align-items:center;gap:8px;padding:16px 36px;font-size:16px;font-weight:800;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s}
    .btn-primary{background:var(--kasbah-red);color:#fff;box-shadow:0 4px 20px var(--kasbah-red-glow)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(193,68,14,.25)}
    .btn-secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--border)}
    .btn-secondary:hover{border-color:var(--kasbah-red);color:var(--kasbah-red)}
    .hero-proof{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:32px;flex-wrap:wrap}
    .proof-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700}
    .badge-live{background:var(--atlas-green-bg);border:1px solid var(--atlas-green-border);color:var(--atlas-green)}
    .badge-saves{background:var(--kasbah-red-light);border:1px solid var(--kasbah-red-glow);color:var(--kasbah-red);font-weight:800}
    .badge-gh{background:var(--card);border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:border-color .2s}
    .badge-gh:hover{border-color:var(--kasbah-red);color:var(--ink)}
    .badge-gh svg{width:14px;height:14px;fill:currentColor}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    /* SECTIONS */
    .section{padding:80px 0;border-top:1px solid var(--border)}
    .section-label{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--kasbah-red);margin-bottom:16px}
    .section h2{font-size:clamp(24px,4vw,36px);font-weight:900;letter-spacing:-.04em;margin-bottom:16px;line-height:1.1;color:var(--midnight)}
    .section p{font-size:15px;color:var(--muted);margin-bottom:14px;line-height:1.7}

    /* TERMINAL */
    .terminal{background:var(--terminal);border-radius:var(--radius-lg);overflow:hidden;margin:28px 0;font-family:'SF Mono',ui-monospace,'Cascadia Code','JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;border:1px solid #1e293b}
    .terminal-bar{background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:7px}
    .td{width:11px;height:11px;border-radius:50%}
    .td.r{background:#C1440E}.td.y{background:#F59E0B}.td.g{background:#065F46}
    .terminal-title{flex:1;text-align:center;font-size:11px;color:#64748b;font-family:'SF Mono',ui-monospace,monospace}
    .terminal-body{padding:20px 22px;color:#e2e8f0;min-height:180px}
    .tl{margin-bottom:3px;opacity:0;transform:translateY(4px);transition:all .3s ease}
    .tl.visible{opacity:1;transform:translateY(0)}
    .tp{color:#065F46}.tw{color:#F59E0B}.tr{color:#C1440E}.tok{color:#065F46}.tm{color:#475569}
    .tag-block{display:inline-block;background:#C1440E;color:#fff;padding:1px 8px;border-radius:4px;font-weight:700;font-size:11px;margin-left:6px}
    .tag-allow{display:inline-block;background:#065F46;color:#fff;padding:1px 8px;border-radius:4px;font-weight:700;font-size:11px;margin-left:6px}
    .sim-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .sim-btn{padding:10px 20px;background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
    .sim-btn:hover{border-color:var(--kasbah-red);color:var(--kasbah-red);background:var(--kasbah-red-light)}
    .sim-btn.active{border-color:var(--kasbah-red);color:var(--kasbah-red);background:var(--kasbah-red-light)}
    .sim-share{display:none;margin-top:12px;padding:10px 16px;background:var(--atlas-green-bg);border:1px solid var(--atlas-green-border);border-radius:8px;font-size:12px;font-weight:600;color:var(--atlas-green);align-items:center;gap:8px}
    .sim-share a{color:var(--atlas-green);font-weight:800;text-decoration:none;margin-left:4px}
    .sim-share a:hover{text-decoration:underline}

    /* PILLARS */
    .pillars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:28px 0}
    .pillar{padding:28px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius-lg);transition:all .25s}
    .pillar:hover{border-color:var(--kasbah-red);transform:translateY(-2px);box-shadow:0 8px 24px rgba(193,68,14,.06)}
    .pillar-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;background:var(--kasbah-red-light)}
    .pillar h3{font-size:16px;font-weight:800;margin-bottom:8px;color:var(--midnight)}
    .pillar p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}

    /* STEPS */
    .steps{list-style:none;padding:0;margin:24px 0}
    .step{display:flex;align-items:flex-start;gap:18px;padding:24px 0;border-bottom:1px solid var(--border-light)}
    .step:last-child{border:0}
    .step-n{width:40px;height:40px;border-radius:50%;background:var(--kasbah-red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
    .step-body{flex:1}
    .step-body strong{font-weight:800;font-size:16px;display:block;margin-bottom:4px;color:var(--midnight)}
    .step-body span{color:var(--muted);font-size:14px}

    /* HERITAGE */
    .heritage{padding:80px 0;border-top:1px solid var(--border);background:var(--bg2);margin:0 -28px;padding-left:28px;padding-right:28px}
    .heritage-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
    .heritage-text .section-label{color:var(--kasbah-red)}
    .heritage-text h2{font-size:clamp(24px,4vw,32px);font-weight:900;letter-spacing:-.04em;margin-bottom:16px;line-height:1.1;color:var(--midnight)}
    .heritage-text p{font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:16px}
    .heritage-features{list-style:none;padding:0;margin:20px 0 0}
    .heritage-features li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;font-weight:600;color:var(--ink)}
    .heritage-features li::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--kasbah-red);flex-shrink:0}
    .heritage-visual{text-align:center}
    .heritage-fortress{font-size:120px;line-height:1;opacity:.15}
    .heritage-quote{margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);border-left:4px solid var(--kasbah-red)}
    .heritage-quote p{font-size:14px;color:var(--muted);line-height:1.7;font-style:italic;margin:0}
    .heritage-quote .attr{font-size:12px;font-weight:700;color:var(--kasbah-red);margin-top:8px;font-style:normal}

    /* SIGNUP */
    .signup{padding:80px 0;border-top:1px solid var(--border);text-align:center;position:relative}
    .signup::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:800px;height:400px;background:radial-gradient(ellipse,var(--kasbah-red-light) 0%,transparent 70%);pointer-events:none}
    .signup>*{position:relative;z-index:1}
    .signup-inner{max-width:520px;margin:0 auto}
    .signup h2{font-size:32px;font-weight:900;letter-spacing:-.03em;margin-bottom:8px;color:var(--midnight)}
    .signup .su-sub{font-size:15px;color:var(--muted);margin-bottom:28px;line-height:1.6}
    .su-urgency{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--saffron-bg);border:1px solid rgba(245,158,11,.2);font-size:12px;font-weight:700;color:var(--saffron-gold);margin-bottom:20px}
    .su-form{display:flex;gap:10px;margin-bottom:12px}
    .su-input{flex:1;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;font-weight:500;background:var(--card);color:var(--ink);transition:border-color .2s;outline:none}
    .su-input::placeholder{color:var(--subtle)}
    .su-input:focus{border-color:var(--kasbah-red)}
    .su-btn{padding:14px 28px;background:var(--kasbah-red);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
    .su-btn:hover{box-shadow:0 4px 20px var(--kasbah-red-glow);transform:translateY(-1px)}
    .su-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
    .su-note{font-size:11px;color:var(--subtle);margin-top:4px}
    .su-result{display:none;padding:16px;background:var(--atlas-green-bg);border:1px solid var(--atlas-green-border);border-radius:var(--radius);margin-top:12px;font-size:14px;font-weight:600;color:var(--atlas-green)}
    .su-count{margin-top:24px;font-size:13px;color:var(--subtle)}
    .su-count strong{color:var(--kasbah-red);font-size:24px;font-weight:900}

    /* SAFE */
    .safe-features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px}
    .safe-feat{padding:20px;background:var(--bg2);border:1px solid var(--border-light);border-radius:var(--radius);text-align:center}
    .safe-feat .sf-icon{font-size:24px;margin-bottom:8px}
    .safe-feat strong{font-size:12px;display:block;margin-bottom:4px;color:var(--midnight)}
    .safe-feat span{color:var(--muted);font-size:11px}

    /* DOWNLOAD */
    .download{padding:64px 0;border-top:1px solid var(--border)}
    .download h3{font-size:24px;font-weight:900;margin-bottom:8px;color:var(--midnight)}
    .download .dl-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
    .dl-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    .dl-card{padding:24px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius-lg);transition:all .25s}
    .dl-card:hover{border-color:var(--kasbah-red);transform:translateY(-2px)}
    .dl-card h4{font-size:15px;font-weight:800;margin-bottom:6px;color:var(--midnight)}
    .dl-card p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
    .dl-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--kasbah-red);text-decoration:none;transition:opacity .15s}
    .dl-link:hover{opacity:.8}
    .dl-note{font-size:11px;color:var(--subtle);margin-top:14px;line-height:1.8}
    .dl-note code{background:var(--bg2);padding:2px 6px;font-size:11px;border-radius:4px;border:1px solid var(--border-light)}

    /* ENTERPRISE */
    .enterprise{padding:64px 0;border-top:1px solid var(--border);text-align:center}
    .enterprise-inner{max-width:560px;margin:0 auto}
    .enterprise h3{font-size:24px;font-weight:900;margin-bottom:8px;color:var(--midnight)}
    .enterprise p{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:24px}
    .enterprise-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:var(--desert-sky);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s}
    .enterprise-btn:hover{opacity:.9;transform:translateY(-1px)}
    .enterprise-features{display:flex;gap:24px;justify-content:center;margin-top:20px;flex-wrap:wrap}
    .enterprise-features span{font-size:12px;color:var(--subtle);font-weight:600}

    /* FOOTER */
    footer{padding:48px 0;border-top:1px solid var(--border);background:var(--bg2)}
    .footer-in{max-width:1080px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
    .footer-left{font-size:12px;color:var(--subtle)}
    .footer-left a{color:var(--muted);text-decoration:none;font-weight:600}
    .footer-left a:hover{color:var(--kasbah-red)}
    .footer-left .f-ar{direction:rtl;color:var(--subtle);font-size:11px;margin-top:2px}
    .footer-links{display:flex;gap:20px}
    .footer-links a{font-size:12px;color:var(--subtle);text-decoration:none;font-weight:600;transition:color .15s}
    .footer-links a:hover{color:var(--kasbah-red)}

    /* RESPONSIVE */
    @media(max-width:700px){
      .pillars{grid-template-columns:1fr}
      .dl-row{grid-template-columns:1fr}
      .testimonials{grid-template-columns:1fr}
      .blog-cards{grid-template-columns:1fr}
      .safe-features{grid-template-columns:1fr}
      .heritage-inner{grid-template-columns:1fr}
      .heritage-visual{display:none}
      .hero{padding:60px 0 50px}
      .su-form{flex-direction:column}
      .hero-actions{flex-direction:column;align-items:center}
      .n-links a:not(.n-cta){display:none}
      .footer-in{flex-direction:column;text-align:center}
      .enterprise-features{flex-direction:column;align-items:center}
    }
  
/* UX polish */
.section { scroll-margin-top: 90px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid rgba(220,38,38,.35); outline-offset: 2px; }
.demo-note { margin-top: 10px; color: var(--muted); font-size: 13px; }
.demo-foot { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.demo-disclaimer { color: var(--muted); font-size: 13px; }
.demo-cta { display: inline-flex; align-self: flex-start; font-weight: 800; text-decoration: none; }
.demo-cta:hover { text-decoration: underline; }
.trust ul { margin: 12px 0 0; padding-left: 18px; }
.trust li { margin: 8px 0; }
.install-steps { margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(254,252,250,.6); }
.install-steps h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: .01em; }
.install-steps ol { margin: 0; padding-left: 18px; }
.install-steps li { margin: 6px 0; }
.install-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.signup-micro { margin-top: 10px; font-size: 13px; color: var(--muted); }


.hero-example { display:block; margin-top:8px; font-size:14px; color:var(--muted); }
.sim-outcome { margin-top:12px; padding:10px 14px; border-radius:999px; font-weight:800; width:fit-content; }
.sim-outcome.ok { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
.sim-outcome.blocked { background:#fef2f2; color:#7f1d1d; border:1px solid #fecaca; }
.sim-outcome.hidden { display:none; }
.who-for ul { margin-top:10px; padding-left:18px; }
.who-for li { margin:6px 0; }
.human-line { margin-top:24px; font-size:14px; color:var(--muted); text-align:center; }

</style>
