[workspace]
resolver = "2"
members = [
    "crates/kasbah-kernel",
    "crates/kasbah-wasm",
    "apps/desktop/src-tauri",
]
exclude = [
    "crates/kernel",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
