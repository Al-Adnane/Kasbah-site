# Standalone crate — opt out of parent workspace discovery
[workspace]

[package]
name = "kasbah-cli"
version = "1.0.0"
edition = "2021"
description = "Kasbah Guard CLI — scan files and directories for sensitive data leaks"
license = "MIT"

[[bin]]
name = "kasbah"
path = "src/main.rs"

[dependencies]
kasbah-kernel = { path = "../../crates/kasbah-kernel" }
clap = { version = "4", features = ["derive", "color"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
colored = "2"
anyhow = "1"
notify = { version = "6", features = ["macos_kqueue"] }
