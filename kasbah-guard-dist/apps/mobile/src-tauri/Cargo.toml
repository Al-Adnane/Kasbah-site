# Standalone crate — opt out of parent workspace discovery
[workspace]

[package]
name = "kasbah-guard-mobile"
version = "1.0.0"
edition = "2021"
description = "Kasbah Guard Mobile — iOS + Android sensitive data scanner"
license = "MIT"

[lib]
name = "kasbah_guard_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same moat alias pattern as desktop — avoids workspace coupling
kasbah-moats = { path = "../../../crates/kasbah-kernel", package = "kasbah-kernel" }

# Mobile-specific plugins
tauri-plugin-haptics = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
