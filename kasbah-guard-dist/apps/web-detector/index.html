<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasbah Guard — Web Detector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-row">
        <span class="logo-icon">🛡️</span>
        <div>
          <h1 class="title">Kasbah Guard</h1>
          <p class="subtitle">Browser-based sensitive data detector · Powered by WASM</p>
        </div>
      </div>
      <div class="engine-badge">
        Engine v3.5.2 · 23 invariants · Zero server round-trips
      </div>
    </header>

    <!-- Input -->
    <section class="input-section">
      <textarea
        id="input"
        class="input-area"
        placeholder="Paste any text here — SSNs, API keys, connection strings, PII…"
        rows="10"
        spellcheck="false"
      ></textarea>

      <!-- Preset buttons -->
      <div class="presets">
        <span class="presets-label">Try:</span>
        <button class="preset-btn" data-text="Hello, world! This is safe text.">Safe text</button>
        <button class="preset-btn" data-text="My SSN is 123-45-6789 and DOB is 01/01/1990">SSN</button>
        <button class="preset-btn" data-text="Card: 4532-1234-5678-9012 CVV: 123">Credit Card</button>
        <button class="preset-btn" data-text="mongodb://admin:s3cr3t@db.company.com:27017/prod">DB String</button>
        <button class="preset-btn" data-text="AKIAIOSFODNN7EXAMPLE secret: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY">AWS Keys</button>
        <button class="preset-btn" data-text="-----BEGIN RSA PRIVATE KEY-----&#10;MIIEowIBAAKCAQEA...">Private Key</button>
      </div>
    </section>

    <!-- Action buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="scan-btn">🔍 Scan</button>
      <button class="btn btn-secondary" id="redact-btn">✂️ Redact</button>
      <button class="btn btn-ghost" id="clear-btn">Clear</button>
    </div>

    <!-- Result panel -->
    <section id="result-panel" class="result-panel hidden">
      <div class="verdict-row">
        <span id="verdict-icon" class="verdict-icon"></span>
        <div class="verdict-info">
          <span id="verdict-label" class="verdict-label"></span>
          <span id="risk-score" class="risk-score"></span>
        </div>
        <span id="decision-chip" class="decision-chip"></span>
      </div>

      <!-- Risk bar -->
      <div class="risk-bar-track">
        <div id="risk-bar" class="risk-bar-fill"></div>
      </div>

      <!-- Reason list -->
      <ul id="reasons" class="reasons"></ul>

      <!-- Performance -->
      <p id="perf" class="perf"></p>
    </section>

    <!-- Status -->
    <div id="status" class="status">Loading Kasbah Detection Engine…</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
