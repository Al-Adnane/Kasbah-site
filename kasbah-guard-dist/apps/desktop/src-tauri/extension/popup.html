<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#fffcf8;color:#1e1e1e;width:320px;min-height:200px}
    .header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #e7ded6}
    .logo{width:40px;height:40px;border-radius:12px}
    .brand{flex:1}
    .brand-name{font-weight:800;font-size:16px}
    .brand-tag{font-size:11px;color:#6b625a}
    .status{padding:16px}
    .status-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fcf9f6;border-radius:12px;margin-bottom:12px}
    .status-indicator{display:flex;align-items:center;gap:8px}
    .dot{width:10px;height:10px;border-radius:50%;background:#dc2626}
    .dot.on{background:#059669}
    .status-text{font-size:13px;font-weight:600}
    .crypto-tag{font-size:9px;color:#6b625a;background:#fcf9f6;padding:2px 6px;border-radius:4px;border:1px solid #e7ded6}
    .authority-box{padding:0 16px 12px}
    .auth-status{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fcf9f6;border:1px solid #e7ded6;border-radius:10px;margin-bottom:8px}
    .auth-label{font-size:10px;font-weight:700;color:#6b625a;text-transform:uppercase;letter-spacing:.04em}
    .auth-value{font-size:13px;font-weight:800;flex:1}
    .auth-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:6px}
    .badge-bound{background:#ecfdf5;color:#1f7a4a;border:1px solid #bbf7d0}
    .badge-unbound{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 12px}
    .stat{background:#fcf9f6;border:1px solid #e7ded6;border-radius:12px;padding:10px;text-align:center}
    .stat-val{font-size:18px;font-weight:800}
    .stat-lbl{font-size:10px;color:#6b625a;margin-top:2px}
    .actions{padding:0 16px 16px}
    .btn{display:block;width:100%;padding:11px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;text-align:center;text-decoration:none;margin-top:8px;transition:all .15s;font-family:inherit}
    .btn-ledger{background:#1e1e1e;color:#fffcf8}
    .btn-ledger:hover{background:#333}
    .btn-reclaim{background:#dc2626;color:#fff;border:none}
    .btn-reclaim:hover{background:#b91c1c}
    .footer{padding:12px 16px;border-top:1px solid #e7ded6;text-align:center;font-size:11px;color:#6b625a}
    .footer a{color:#1e1e1e;text-decoration:none}
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="icon48.png" alt="Kasbah">
    <div class="brand">
      <div class="brand-name">Kasbah Guard</div>
      <div class="brand-tag">Authority Layer</div>
    </div>
  </div>
  <div class="status">
    <div class="status-row">
      <div class="status-indicator">
        <div class="dot" id="dot"></div>
        <span class="status-text" id="txt">Checking...</span>
      </div>
      <span class="crypto-tag" id="cryptoTag">&mdash;</span>
    </div>
  </div>
  <div class="authority-box">
    <div class="auth-status">
      <div>
        <div class="auth-label">Session</div>
        <div class="auth-value" id="authSession">Detecting...</div>
      </div>
      <span class="auth-badge badge-unbound" id="authBadge">UNBOUND</span>
    </div>
    <div class="auth-status">
      <div>
        <div class="auth-label">Authority</div>
        <div class="auth-value" id="authHolder">Not claimed</div>
      </div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Decisions</div></div>
    <div class="stat"><div class="stat-val" id="sAllow" style="color:#059669">0</div><div class="stat-lbl">Allowed</div></div>
    <div class="stat"><div class="stat-val" id="sDeny" style="color:#dc2626">0</div><div class="stat-lbl">Denied</div></div>
  </div>
  <div class="actions">
    <a href="http://127.0.0.1:8788/status" target="_blank" class="btn btn-ledger">View Ledger</a>
    <button class="btn btn-reclaim" id="reclaimBtn" onclick="reclaim()">Reclaim Authority</button>
  </div>
  <div class="footer">
    <a href="https://github.com/Al-Adnane/Kasbah-site" target="_blank">GitHub</a> &middot; v1.0
  </div>
  <script>
    var GUARD='http://127.0.0.1:8788';
    function poll(){
      fetch(GUARD+'/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
        var ok=d.ok===true;
        document.getElementById('dot').className='dot'+(ok?' on':'');
        document.getElementById('txt').textContent=ok?'Enforcement Active':'Enforcement Offline';
        if(d.crypto) document.getElementById('cryptoTag').textContent=d.crypto.toUpperCase();
        if(d.stats){
          document.getElementById('sTotal').textContent=d.stats.total||0;
          document.getElementById('sAllow').textContent=d.stats.allowed||0;
          document.getElementById('sDeny').textContent=d.stats.denied||0;
          // Update authority status
          if((d.stats.total||0)>0){
            document.getElementById('authBadge').className='auth-badge badge-bound';
            document.getElementById('authBadge').textContent='BOUND';
            document.getElementById('authSession').textContent='Active';
            document.getElementById('authHolder').textContent='You (personal)';
          }
        }
      }).catch(function(){
        document.getElementById('dot').className='dot';
        document.getElementById('txt').textContent='Enforcement Offline';
      });
    }
    function reclaim(){
      if(confirm('You are reclaiming sovereignty. All delegated rights will be revoked immediately.')){
        fetch(GUARD+'/events',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({kind:'RECLAIM',data:{action:'sovereignty_reclaimed',source:'extension'}})
        }).then(function(){
          document.getElementById('authBadge').className='auth-badge badge-unbound';
          document.getElementById('authBadge').textContent='RECLAIMED';
          document.getElementById('authSession').textContent='Reclaimed';
          alert('Authority reclaimed. All delegated rights revoked.');
        }).catch(function(){alert('Failed to reach guard service.');});
      }
    }
    poll();setInterval(poll,3000);
  </script>
</body>
</html>
