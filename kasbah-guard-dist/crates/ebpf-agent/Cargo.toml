[package]
name = "kasbah-ebpf-agent"
version = "0.1.0"
edition = "2021"
description = "Kasbah Guard v2.0 — Kernel-level enforcement agent using eBPF (Linux)"

[dependencies]
# eBPF userspace (only on Linux)
# aya = "0.12"
# aya-log = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
