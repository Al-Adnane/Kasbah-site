[workspace]

[package]
name = "kasbah-ppp-modules"
version = "1.0.0"
edition = "2021"
description = "PPP nature-inspired security modules for Kasbah Guard"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
dashmap = "5.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
