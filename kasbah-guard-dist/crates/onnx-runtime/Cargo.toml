[package]
name = "kasbah-onnx-runtime"
version = "1.0.0"
edition = "2021"
description = "ONNX model inference runtime for Kasbah Guard ML components"

[dependencies]
# ONNX inference
ort = { version = "1.16", features = ["cuda", "tensorrt"] }
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }

# Image processing
image = "0.24"
imageproc = "0.23"

# Audio processing
cpal = "0.17"
hound = "3.5"
rustfft = "6.1"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Performance & caching
dashmap = "5.5"
lru = "0.12"
parking_lot = "0.12"

# Monitoring
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Testing
mockito = "1.2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "inference_benchmark"
harness = false
