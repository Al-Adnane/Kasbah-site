[package]
name = "kasbah-kernel"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
rusqlite = { version = "0.31", features = ["bundled"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
regex = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
