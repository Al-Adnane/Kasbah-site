[package]
name = "kasbah-ebpf-lock"
version = "1.0.0"
edition = "2021"
description = "Execution ticket system for Kasbah Guard kernel-level validation"

[[bin]]
name = "ticket-server"
path = "src/bin/ticket-server.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { version = "0.8", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"

[workspace]
