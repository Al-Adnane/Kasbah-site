[package]
name = "kasbah-signal-processing"
version = "1.0.0"
edition = "2021"
description = "Audio/video signal preprocessing for ONNX models in Kasbah Guard"
authors = ["Kasbah Guard Team"]
license = "MIT"

[dependencies]
# Numerical arrays — shared with onnx-runtime
ndarray = "0.15"

# FFT engine — real DFT for MFCC and spectrogram extraction
rustfft = "6.1"

# WAV file I/O
hound = "3.5"

# Image loading, decoding, and resizing
image = "0.24"

# Serialization (feature vectors, config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (for future streaming / pipeline use)
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
approx = "0.5"

# Opt out of the parent workspace so this crate builds independently.
# To include it in the workspace, add "crates/signal-processing" to
# workspace.members in kasbah-guard-dist/Cargo.toml when ready.
[workspace]
